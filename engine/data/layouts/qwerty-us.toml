# QWERTY US physical layout: finger, hand and row for every key.
# row: 0 = number row, 1 = top, 2 = home, 3 = bottom, 4 = space bar.
# x: horizontal key centre in key widths (row stagger included), used for adjacency.
# code: Linux evdev key code (what winit reports as the scancode on Linux).

name = "qwerty-us"
shift_keys = [{ code = 42, hand = "left", finger = "l_pinky" }, { code = 54, hand = "right", finger = "r_pinky" }]

[[keys]]
base = "`"
shifted = "~"
row = 0
x = 0.5
finger = "l_pinky"
hand = "left"
code = 41

