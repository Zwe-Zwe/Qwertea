[project]
name = "qwertea-engine"
version = "1.0.1"
description = "Qwertea analysis engine: derivation, weakness model and lesson brewing"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "typer>=0.12",
]

[project.scripts]
qwertea-engine = "qwertea_engine.cli:app"

[project.optional-dependencies]
insight = [
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwertea_engine"]

# Data the installed engine needs, copied into the package (see paths.py).
[tool.hatch.build.targets.wheel.force-include]
"../schema" = "qwertea_engine/schema"
"../config.toml" = "qwertea_engine/default_config.toml"
"data/layouts" = "qwertea_engine/data/layouts"
"data/bundled" = "qwertea_engine/data/bundled"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# HTML template and typographic characters in report text / corpus cleaning tables.
"qwertea_engine/report/*" = ["E501", "RUF001"]
"qwertea_engine/corpus_build.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qwertea_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
