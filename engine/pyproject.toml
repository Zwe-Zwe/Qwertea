[project]
name = "qwertea-engine"
version = "0.1.0"
description = "Qwertea analysis engine: derivation, weakness model and lesson brewing"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "typer>=0.12",
]

[project.scripts]
qwertea-engine = "qwertea_engine.cli:app"

[project.optional-dependencies]
insight = [
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwertea_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qwertea_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
